name: Sync AI Platform templates

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Configured target repository, or 'all'"
        required: true
        default: all
        type: string
      dry_run:
        description: "Inspect planned changes without creating a pull request"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: targets
        env:
          REQUESTED_TARGET: ${{ inputs.target_repository }}
        run: |
          matrix="$(jq -c --arg target "$REQUESTED_TARGET" '{include: [.targets[] | select(.enabled == true and ($target == "all" or .repository == $target))]}' .github/sync-targets.json)"
          if [ "$(jq '.include | length' <<< "$matrix")" -eq 0 ]; then
            echo "No enabled target matches '$REQUESTED_TARGET'." >&2
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  sync:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out AI Platform
        uses: actions/checkout@v4
        with:
          path: platform

      - name: Require an explicitly configured target token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_REPOSITORIES_TOKEN }}
        run: |
          test -n "$SYNC_TOKEN" || {
            echo "SYNC_REPOSITORIES_TOKEN is required. Use a fine-grained token limited to the configured target repositories." >&2
            exit 1
          }

      - name: Check out target repository on an isolated sync branch
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          token: ${{ secrets.SYNC_REPOSITORIES_TOKEN }}
          path: target
          persist-credentials: true

      - name: Apply opted-in template updates
        env:
          TARGET: ${{ toJSON(matrix) }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = json.loads(os.environ["TARGET"])
          source_root = Path("platform")
          destination_root = Path("target")

          def safe_relative(value: str) -> Path:
              path = Path(value)
              if path.is_absolute() or ".." in path.parts:
                  raise ValueError(f"Unsafe configured path: {value}")
              return path

          for item in target.get("files", []):
              if not item.get("enabled", False):
                  continue
              source = source_root / safe_relative(item["source"])
              destination = destination_root / safe_relative(item["destination"])
              if not source.is_file():
                  raise FileNotFoundError(f"Configured source is missing: {source}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(source.read_bytes())

          rules = target.get("agent_rules", {})
          if rules.get("enabled", False):
              source = source_root / safe_relative(rules["source"])
              destination = destination_root / safe_relative(rules["destination"])
              start = rules["start_marker"]
              end = rules["end_marker"]
              text = destination.read_text(encoding="utf-8")
              replacement = source.read_text(encoding="utf-8").strip()
              start_index = text.find(start)
              end_index = text.find(end, start_index)
              if start_index < 0 or end_index < 0:
                  raise ValueError(f"Markers are required before syncing {destination}")
              end_index += len(end)
              destination.write_text(text[:start_index] + replacement + text[end_index:], encoding="utf-8")
          PY

      - name: Show planned changes
        working-directory: target
        run: |
          git diff --check
          git diff --stat
          git diff --exit-code || true

      - name: Create or update the synchronization pull request
        if: inputs.dry_run == false
        uses: peter-evans/create-pull-request@v7
        with:
          path: target
          token: ${{ secrets.SYNC_REPOSITORIES_TOKEN }}
          branch: chore/sync-ai-platform-rules
          delete-branch: true
          commit-message: "chore: sync AI Platform templates"
          title: "chore: sync AI Platform templates"
          body: |
            <!-- ai-platform-sync -->
            This pull request was generated from the opted-in entries in `sj55576/ai-platform`.

            Review project-specific integration before merging. No target default branch is modified by this workflow.
          draft: true
