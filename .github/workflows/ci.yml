name: Repository CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q scripts tests

      - name: Validate workflow and template YAML
        run: >-
          python -c "import pathlib,yaml;
          files=[*pathlib.Path('.github/workflows').glob('*.yml'),*pathlib.Path('templates').glob('*.yml')];
          [yaml.safe_load(p.read_text(encoding='utf-8')) for p in files];
          assert files, 'No YAML files were checked'"
